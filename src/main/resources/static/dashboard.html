<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPulse - Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        h1 { color: #333; margin-bottom: 5px; }
        .subtitle { color: #888; margin-bottom: 20px; }
        .stats { display: flex; gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 15px 25px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); text-align: center; }
        .stat-card h3 { font-size: 28px; color: #333; }
        .stat-card p { color: #888; font-size: 13px; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .controls input, .controls select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .controls input { width: 200px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #4CAF50; color: white; }
        .btn-secondary { background: #2196F3; color: white; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        th { background: #333; color: white; padding: 12px 15px; text-align: left; font-size: 13px; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 14px; }
        tr:hover { background: #f0f7ff; cursor: pointer; }
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-active { background: #d4edda; color: #155724; }
        .badge-rejected { background: #f8d7da; color: #721c24; }
        .badge-offer { background: #cce5ff; color: #004085; }
        .badge-high { background: #fff3cd; color: #856404; }
        .badge-medium { background: #e2e3e5; color: #383d41; }
        .badge-low { background: #f8f9fa; color: #6c757d; }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-cleared { background: #d4edda; color: #155724; }
        .badge-failed { background: #f8d7da; color: #721c24; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .empty { text-align: center; padding: 40px; color: #888; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; color: #2196F3; font-weight: bold; }

        /* Rounds Panel */
        .rounds-panel {
            display: none;
            margin-top: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            padding: 20px;
        }
        .rounds-panel h3 { margin-bottom: 15px; color: #333; }
        .rounds-panel h3 span { color: #2196F3; }
        .round-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 6px;
            margin-bottom: 8px;
            background: #fafafa;
        }
        .round-item .round-name { font-weight: bold; min-width: 120px; }
        .round-item .round-date { color: #888; font-size: 13px; min-width: 100px; }
        .round-item .round-notes { color: #666; font-size: 13px; flex: 1; }
        .round-status-select {
            padding: 4px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }
        .add-round-form {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .add-round-form input, .add-round-form select {
            padding: 7px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }
        .add-round-form label { font-size: 12px; color: #555; display: block; margin-bottom: 3px; }
        .add-round-form .form-field { display: flex; flex-direction: column; }
        .close-btn { float: right; background: none; border: none; font-size: 20px; cursor: pointer; color: #888; }
        .no-rounds { color: #888; font-style: italic; padding: 10px 0; }
    </style>
</head>
<body>
    <nav>
        <a href="/index.html">+ Add Job</a>
        <a href="/dashboard.html">Dashboard</a>
    </nav>
    <h1>JobPulse</h1>
    <p class="subtitle">Track your placement journey</p>

    <div class="stats">
        <div class="stat-card"><h3 id="totalCount">0</h3><p>Total Applied</p></div>
        <div class="stat-card"><h3 id="activeCount">0</h3><p>Active</p></div>
        <div class="stat-card"><h3 id="offerCount">0</h3><p>Offers</p></div>
        <div class="stat-card"><h3 id="rejectedCount">0</h3><p>Rejected</p></div>
    </div>

    <div class="controls">
        <input type="text" id="searchCompany" placeholder="Search company..." oninput="filterJobs()">
        <select id="filterStatus" onchange="filterJobs()">
            <option value="">All Status</option>
            <option value="ACTIVE">Active</option>
            <option value="OFFER">Offer</option>
            <option value="REJECTED">Rejected</option>
        </select>
        <select id="filterPriority" onchange="filterJobs()">
            <option value="">All Priority</option>
            <option value="HIGH">High</option>
            <option value="MEDIUM">Medium</option>
            <option value="LOW">Low</option>
        </select>
        <button class="btn btn-secondary" onclick="resetFilters()">Reset</button>
        <button class="btn btn-primary" onclick="window.location.href='/index.html'">+ Add Job</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Company</th>
                <th>Role</th>
                <th>Location</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Applied Date</th>
                <th>Rounds</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="jobTableBody">
            <tr><td colspan="9" class="empty">Loading...</td></tr>
        </tbody>
    </table>

    <!-- Rounds Panel -->
    <div class="rounds-panel" id="roundsPanel">
        <button class="close-btn" onclick="closeRoundsPanel()">✕</button>
        <h3>Rounds for <span id="selectedJobName"></span></h3>
        <div id="roundsList"></div>

        <div class="add-round-form">
            <div class="form-field">
                <label>Round Name</label>
                <input type="text" id="newRoundName" placeholder="e.g. Aptitude" list="roundSuggestions">
                <datalist id="roundSuggestions">
                    <option value="Aptitude">
                    <option value="Technical">
                    <option value="HR">
                    <option value="Managerial">
                    <option value="Group Discussion">
                    <option value="Coding Test">
                </datalist>
            </div>
            <div class="form-field">
                <label>Order</label>
                <input type="number" id="newRoundOrder" min="1" value="1" style="width:60px">
            </div>
            <div class="form-field">
                <label>Date</label>
                <input type="date" id="newRoundDate">
            </div>
            <div class="form-field">
                <label>Notes</label>
                <input type="text" id="newRoundNotes" placeholder="Any notes..." style="width:200px">
            </div>
            <button class="btn btn-primary" onclick="addRound()">+ Add Round</button>
        </div>
    </div>

    <script>
        let allJobs = [];
        let selectedJobId = null;

        async function loadJobs() {
            try {
                const response = await fetch('/api/jobs');
                allJobs = await response.json();
                updateStats(allJobs);
                renderTable(allJobs);
            } catch (error) {
                document.getElementById('jobTableBody').innerHTML =
                    '<tr><td colspan="9" class="empty">Cannot connect to server.</td></tr>';
            }
        }

        function updateStats(jobs) {
            document.getElementById('totalCount').textContent = jobs.length;
            document.getElementById('activeCount').textContent = jobs.filter(j => j.status === 'ACTIVE').length;
            document.getElementById('offerCount').textContent = jobs.filter(j => j.status === 'OFFER').length;
            document.getElementById('rejectedCount').textContent = jobs.filter(j => j.status === 'REJECTED').length;
        }

        function renderTable(jobs) {
            const tbody = document.getElementById('jobTableBody');
            if (jobs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="empty">No applications found.</td></tr>';
                return;
            }
            tbody.innerHTML = jobs.map((job, index) => `
                <tr onclick="openRoundsPanel(${job.id}, '${job.companyName} - ${job.role}')">
                    <td>${index + 1}</td>
                    <td><strong>${job.companyName}</strong></td>
                    <td>${job.role}</td>
                    <td>${job.location || '-'}</td>
                    <td><span class="badge badge-${job.priority.toLowerCase()}">${job.priority}</span></td>
                    <td><span class="badge badge-${job.status.toLowerCase()}">${job.status}</span></td>
                    <td>${job.appliedDate}</td>
                    <td>${job.rounds ? job.rounds.length : 0}</td>
                    <td><button class="btn-delete" onclick="event.stopPropagation(); deleteJob(${job.id})">Delete</button></td>
                </tr>
            `).join('');
        }

        async function openRoundsPanel(jobId, jobName) {
            selectedJobId = jobId;
            document.getElementById('selectedJobName').textContent = jobName;
            document.getElementById('roundsPanel').style.display = 'block';
            await loadRounds(jobId);
            document.getElementById('roundsPanel').scrollIntoView({ behavior: 'smooth' });
        }

        function closeRoundsPanel() {
            document.getElementById('roundsPanel').style.display = 'none';
            selectedJobId = null;
        }

        async function loadRounds(jobId) {
            const response = await fetch(`/api/jobs/${jobId}/rounds`);
            const rounds = await response.json();
            const container = document.getElementById('roundsList');

            if (rounds.length === 0) {
                container.innerHTML = '<p class="no-rounds">No rounds added yet. Add the first round below.</p>';
                return;
            }

            container.innerHTML = rounds.map(round => `
            <div class="round-item">
            <div class="round-name">Round ${round.roundOrder}: ${round.roundName}</div>
                <div class="round-date">${round.roundDate || 'No date'}</div>
                <div class="round-notes">${round.notes || '-'}</div>
                <span class="badge badge-${round.status.toLowerCase()}">${round.status}</span>
                <select class="round-status-select" onchange="updateRoundStatus(${round.id}, this.value)">
                    <option value="PENDING" ${round.status === 'PENDING' ? 'selected' : ''}>PENDING</option>
                    <option value="CLEARED" ${round.status === 'CLEARED' ? 'selected' : ''}>CLEARED</option>
                    <option value="FAILED" ${round.status === 'FAILED' ? 'selected' : ''}>FAILED</option>
                </select>
                <button class="btn-delete" onclick="deleteRound(${jobId}, ${round.id})">Delete</button>
            </div>
        `).join('');
        }

        async function updateRoundStatus(roundId, newStatus) {
        	await fetch(`/api/jobs/${selectedJobId}/rounds/${roundId}/status`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            await loadRounds(selectedJobId);
            await loadJobs();
        }

        async function addRound() {
            const name = document.getElementById('newRoundName').value;
            const order = document.getElementById('newRoundOrder').value;
            const date = document.getElementById('newRoundDate').value;
            const notes = document.getElementById('newRoundNotes').value;

            if (!name) { alert('Round name is required.'); return; }

            await fetch(`/api/jobs/${selectedJobId}/rounds`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roundName: name, roundOrder: parseInt(order), roundDate: date || null, notes: notes })
            });

            document.getElementById('newRoundName').value = '';
            document.getElementById('newRoundNotes').value = '';
            await loadRounds(selectedJobId);
            await loadJobs();
        }

        function filterJobs() {
            const search = document.getElementById('searchCompany').value.toLowerCase();
            const status = document.getElementById('filterStatus').value;
            const priority = document.getElementById('filterPriority').value;
            const filtered = allJobs.filter(job => {
                const matchSearch = job.companyName.toLowerCase().includes(search);
                const matchStatus = status === '' || job.status === status;
                const matchPriority = priority === '' || job.priority === priority;
                return matchSearch && matchStatus && matchPriority;
            });
            updateStats(filtered);
            renderTable(filtered);
        }

        function resetFilters() {
            document.getElementById('searchCompany').value = '';
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterPriority').value = '';
            loadJobs();
        }

        async function deleteJob(id) {
            if (!confirm('Delete this application?')) return;
            try {
            	const response = await fetch(`/api/jobs/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    closeRoundsPanel();
                    loadJobs();
                }
            } catch (error) {
                alert('Cannot connect to server.');
            }
        }
        async function deleteRound(jobId, roundId) {
            if (!confirm('Delete this round?')) return;
            const res = await fetch(`/api/jobs/${jobId}/rounds/${roundId}`, {
                method: 'DELETE'
            });
            console.log('Delete response status:', res.status);
            await loadRounds(jobId);
            await loadJobs();
        }

        loadJobs();
    </script>
</body>
</html>
